name: Build, Test, and Deploy Unity Project

on:
  push:
  pull_request:

env:
  UNITY_VERSION: 6000.0.43f1
  PROJECT_PATH: QA Unity Project

jobs:

  # ============================================================
  # TESTS
  # ============================================================
  testRunner:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Tests-${{ env.UNITY_VERSION }}-${{ hashFiles('QA Unity Project/Assets/**', 'QA Unity Project/Packages/**', 'QA Unity Project/ProjectSettings/**') }}
          restore-keys: |
            Library-Tests-${{ env.UNITY_VERSION }}-

      - name: Run Unity Tests
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          testMode: all
          artifactsPath: artifacts/TestResults

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-Results
          path: artifacts/TestResults


  # ============================================================
  # WEBGL BUILD
  # ============================================================
  buildWebGL:
    name: Build WebGL
    runs-on: ubuntu-latest
    needs: testRunner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-WebGL-${{ env.UNITY_VERSION }}-${{ hashFiles('QA Unity Project/Assets/**', 'QA Unity Project/Packages/**', 'QA Unity Project/ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-${{ env.UNITY_VERSION }}-

      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: WebGL

      - name: Upload WebGL Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-WebGL
          path: build/WebGL


  # ============================================================
  # ANDROID BUILD
  # ============================================================
  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest
    needs: testRunner

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ${{ env.PROJECT_PATH }}/Library
          key: Library-Android-${{ env.UNITY_VERSION }}-${{ hashFiles('QA Unity Project/Assets/**', 'QA Unity Project/Packages/**', 'QA Unity Project/ProjectSettings/**') }}
          restore-keys: |
            Library-Android-${{ env.UNITY_VERSION }}-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: Android

      - name: Upload Android Build
        uses: actions/upload-artifact@v4
        with:
          name: Build-Android
          path: build/Android
